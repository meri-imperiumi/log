name: Run unit tests

on:
  push:
    branches:
    - main
    paths:
    - ".github/**"
  pull_request:
    paths:
    - ".github/**"
  workflow_dispatch:

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-node@v3
      with:
        node-version: 22
    - run: npm install yaml
    - run: node --test .github/crewmiles.test.mjs .github/stormdays.test.mjs
